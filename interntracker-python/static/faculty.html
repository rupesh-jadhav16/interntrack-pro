<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty — InternTracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d9488'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>IT</text></svg>" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="logo" href="/" style="text-decoration:none">
          <span class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg></span>
          <span class="logo-text">Intern<span style="color:#14b8a6">Tracker</span></span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-label">Faculty</div>
        <button class="nav-item active" data-page="dashboard" data-title="Faculty Dashboard" data-sub="Your mentees at a glance"><span id="ic-dashboard"></span>Dashboard</button>
        <button class="nav-item" data-page="students" data-title="My Students" data-sub="Mentee details &amp; flags"><span id="ic-students"></span>Students</button>
        <button class="nav-item" data-page="review" data-title="Report Review" data-sub="Approve or reject reports"><span id="ic-review"></span>Review Queue</button>
        <button class="nav-item" data-page="performance" data-title="Performance" data-sub="Weekly charts &amp; trends"><span id="ic-performance"></span>Performance</button>
      </nav>
      <div class="sidebar-foot">
        <div class="side-user" onclick="toggleDropdown('userDropdown')" id="sideUser"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div><div class="page-title" id="pageTitle">Dashboard</div><div class="page-sub" id="pageSub"></div></div>
        <div class="topbar-right">
          <div class="dropdown" id="notifWrap"></div>
          <div class="dropdown" id="userWrap"></div>
        </div>
      </header>
      <main class="content" id="content">
        <div class="loading-page"><div class="spinner"></div></div>
      </main>
    </div>
  </div>

  <script src="/static/js/ui.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/shell.js"></script>
  <script src="/static/js/faculty.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => shellInit("faculty"));
  </script>
</body>
</html>
